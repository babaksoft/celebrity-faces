[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "celebrity-faces"
version = "0.1.0"
description = "Robust image classification under limited data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "babaksoft", email = "babak.eslamieh@gmail.com" },
]
keywords = ["machine learning", "classification"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*"]

dependencies = [
    "tensorflow[and-cuda]==2.20.0",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "pytorch-lightning==2.6.1",
    "matplotlib==3.10.7",
    "mlflow==3.10.0",
    "pathspec==0.11.2",
    "dvc==3.65.0",
    "dvc-s3==3.3.0",
]

[project.optional-dependencies]
dev = [
    "black==23.12.1",
    "ruff==0.15.7",
    "mypy==1.19.1",
    "isort==8.0.1",
    "pytest==9.0.2",
]

build = [
    "build==1.3.0",
    "hatchling==1.28.0",
]

[project.urls]
Homepage = "https://github.com/babaksoft/celebrity-faces"
Issues = "https://github.com/babaksoft/celebrity-faces/issues"

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src/celebrity_faces"]

[tool.hatch.build]
exclude = [
    "/.dvc",
    "**/*.dvc",
    "**/.gitignore",
    "/notebooks",
    "/tests",
    ".gitignore",
    ".dvcignore",
    "requirements.txt"
]
